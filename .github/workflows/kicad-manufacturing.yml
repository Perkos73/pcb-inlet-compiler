name: KiCad Manufacturing

on:
  workflow_dispatch:
  push:
    tags:
      - "PCB1-PCB-*"

concurrency:
  group: kicad-manufacturing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KICAD_IMAGE: ghcr.io/kicad/kicad:10.0.4
  KICAD_EXPECTED: "10.0."
  PCB: pcb-inlet.kicad_pcb
  PROJECT: pcb-inlet
  REVISION: PCB-INLET_P2-R4.1

jobs:
  manufacture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify KiCad image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$KICAD_IMAGE"
          version="$(docker run --rm "$KICAD_IMAGE" kicad-cli version 2>&1 | tr -d '\r')"
          echo "kicad-cli version: $version"
          case "$version" in
            "$KICAD_EXPECTED"*) ;;
            *)
              echo "::error::Expected KiCad ${KICAD_EXPECTED}x, got: $version"
              exit 96
              ;;
          esac

      - name: Generate production package
        shell: bash
        run: |
          set -euo pipefail

          OUT="production/$REVISION"
          HOME_DIR="$RUNNER_TEMP/kicad-home"

          rm -rf "$OUT" "$HOME_DIR"
          mkdir -p             "$OUT/gerbers"             "$OUT/drill"             "$OUT/netlist"             "$OUT/reports"             "$HOME_DIR/.config"             "$HOME_DIR/.cache/fontconfig"

          kicad() {
            docker run --rm               --user "$(id -u):$(id -g)"               -e HOME=/home/kicad               -e XDG_CONFIG_HOME=/home/kicad/.config               -e XDG_CACHE_HOME=/home/kicad/.cache               -v "$GITHUB_WORKSPACE:/workspace"               -v "$HOME_DIR:/home/kicad"               -w /workspace               "$KICAD_IMAGE"               kicad-cli "$@"
          }

          kicad pcb drc             --format report             --units mm             --severity-all             --output "$OUT/reports/drc-full.rpt"             "$PCB"

          kicad pcb drc             --format report             --units mm             --severity-error             --exit-code-violations             --output "$OUT/reports/drc-gating.rpt"             "$PCB"

          kicad pcb export gerbers             --layers F.Cu,B.Cu,F.Mask,B.Mask,F.Silkscreen,B.Silkscreen,Edge.Cuts             --output "$OUT/gerbers/"             "$PCB"

          kicad pcb export drill             --format excellon             --drill-origin absolute             --excellon-separate-th             --generate-map             --map-format gerberx2             --output "$OUT/drill/"             "$PCB"

          kicad pcb export ipc2581             --units mm             --output "$OUT/netlist/$PROJECT-ipc2581.xml"             "$PCB"

          version="$(docker run --rm "$KICAD_IMAGE" kicad-cli version 2>&1 | tr -d '\r')"

          {
            echo "Project: $PROJECT"
            echo "Revision: $REVISION"
            echo "Source: $PCB"
            echo "KiCad: $version"
            echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: $GITHUB_SHA"
          } > "$OUT/MANIFEST.txt"

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS.txt -print0               | sort -z               | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: pcb-inlet-${{ env.REVISION }}
          path: production/${{ env.REVISION }}/
          if-no-files-found: error
