name: Generate PCB Fabrication Files
on: [push]

jobs:
  kicad-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run KiCad DRC and Export
        run: |
          docker run --rm --user root -v ${{ github.workspace }}:/workspace -w /workspace kicad/kicad:8.0 sh -c "
            kicad-cli pcb drc --severity-error pcb_inlet.kicad_pcb -o drc_report.txt || true
            mkdir -p gerber_output
            kicad-cli pcb export gerbers pcb_inlet.kicad_pcb -o gerber_output/
            kicad-cli pcb export drill pcb_inlet.kicad_pcb -o gerber_output/
          "

      - name: Upload Gerbers as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gerber-files-package
          path: |
            gerber_output/
            drc_report.txt
